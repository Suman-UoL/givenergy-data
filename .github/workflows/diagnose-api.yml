name: Diagnose GivEnergy API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run diagnostic
        env:
          GIVENERGY_API_KEY: ${{ secrets.GIVENERGY_API_KEY }}
        run: python scripts/diagnose.py
