name: Backfill Battery Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-09-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-10-03'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Backfill in 45 day chunks, saving after each
        env:
          GIVENERGY_API_KEY: ${{ secrets.GIVENERGY_API_KEY }}
        run: |
          git config user.name "givenergy-bot"
          git config user.email "bot@givenergy-data"
          start="${{ inputs.start_date }}"; end="${{ inputs.end_date }}"
          cur="$start"
          while [ "$(date -d "$cur" +%s)" -le "$(date -d "$end" +%s)" ]; do
            chunk_end=$(date -d "$cur + 44 days" +%F)
            if [ "$(date -d "$chunk_end" +%s)" -gt "$(date -d "$end" +%s)" ]; then chunk_end="$end"; fi
            echo "== $cur to $chunk_end"
            python -u scripts/battery_backfill.py "$cur" "$chunk_end"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "chore: battery backfill $cur to $chunk_end"
              git pull --rebase -q
              git push -q
            fi
            cur=$(date -d "$chunk_end + 1 day" +%F)
          done
